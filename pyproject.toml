[tool.poetry]
name = "telenotes"
version = "0.1.0"
description = ""
authors = ["Blackgolyb <andrejomelnickij@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "bot" }]

[tool.poetry.dependencies]
python = "^3.11"
pygithub = "^2.1.1"
aiogram = "^3.1.1"
envparse = "^0.2.0"
sqlalchemy = "^2.0.22"
alembic = "^1.12.0"
sqlalchemy-utils = "^0.41.1"
pydantic-settings = "^2.3.4"
asyncpg = "^0.29.0"
aiogram-forms = "^1.1.1"


[tool.poetry.group.dev.dependencies]
ruff = "^0.1.0"


[tool.ruff]
extend-select = [
    "I",  #isort
    "UP", #pyupgrade
    # "D",  #pydocstyle
    "F", #pyflakes
]

[tool.ruff.extend-per-file-ignores]
# Also ignore `F401` in all `__init__.py` files.
"__init__.py" = ["F401"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
